[project]
name = "ecommerce-ai-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai==2.54.0",
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "asyncpg",
    "pydantic-settings",
    "greenlet",
    "python-dotenv",
    "redis",
    "bcrypt",
    "PyJWT",
    "email-validator",
    "alembic",
    "boto3",
    "python-multipart",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[dependency-groups]
seeds = ["requests"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-p", "pytest_asyncio.plugin"]
filterwarnings = ["ignore::DeprecationWarning"]
