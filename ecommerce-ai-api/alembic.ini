# A generic, single database configuration.

[alembic]
script_location = %(here)s/alembic
# src/ modelleri için; env.py DATABASE_URL'i Settings'ten yazar
prepend_sys_path = .:src
path_separator = os
# Placeholder — gerçek URL env.py içinde .env / Settings ile set edilir
sqlalchemy.url = postgresql+asyncpg://postgres:CHANGE_ME@127.0.0.1:5432/ecommerce_ai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
